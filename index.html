<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e4f3ff"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>My Daily Glow</title><style>*{box-sizing:border-box}body{margin:0;background:#eef8ff;color:#18344f;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:550px;margin:auto;padding:25px 18px 60px}h1{margin:0;font-size:29px}p{color:#637e94}input[type=date]{width:100%;padding:13px;border:1px solid #c7e1f5;border-radius:12px;font-size:17px;background:white}.card{background:white;padding:20px;border:1px solid #d8eafa;border-radius:20px;margin:18px 0;box-shadow:0 5px 20px #244e730d}h2{font-size:20px;margin:0 0 12px}.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #e6f2fb}.item input{width:24px;height:24px;accent-color:#6b9fc7}.item:has(input:checked) span{text-decoration:line-through;color:#829bac}.track{height:12px;background:#dcecf8;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:#6b9fc7}button{background:#477da8;color:white;border:0;border-radius:14px;padding:15px;width:100%;font-size:16px}.nav{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}.nav button{min-width:30%}.nav button{flex:1;padding:12px;background:#dceefa;color:#345a7a}.nav button.active{background:#477da8;color:white}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#fff;border:1px solid #d8eafa;border-radius:17px;padding:17px}.stat b{display:block;font-size:29px;color:#477da8;margin:7px 0}.stat small{color:#637e94}.muted{color:#637e94;font-size:13px}.hidden{display:none}.bar{height:9px;border-radius:10px;background:#dcecf8;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:#6b9fc7}.date-nav{display:flex;align-items:center;gap:10px;margin:16px 0 22px}.date-nav>button{width:48px;flex:none;font-size:29px;padding:9px;background:#dceefa;color:#345a7a}.date-center{flex:1;min-width:0;text-align:center}.date-center strong{display:block;margin-bottom:5px}.date-center input{padding:9px;text-align:center;font-size:15px}.date-nav button:disabled{opacity:.3}</style></head><body><main><h1>🌸 My Daily Glow</h1><p style="font-size:12px;margin:5px 0;color:#6c96b5">Mavi sürüm • v9</p><nav class="nav"><button id="routineTab" class="active" type="button">🌸 Günlük rutin</button><button id="dashboardTab" type="button">📊 Dashboard</button></nav><div class="date-nav"><button id="prevDay" type="button" aria-label="Önceki gün">‹</button><div class="date-center"><strong id="dateLabel">Bugün</strong><input type="date" id="date" aria-label="Tarih seç"></div><button id="nextDay" type="button" aria-label="Sonraki gün">›</button></div><div id="routineView"><div class="card"><h2>🏃 Spor yaptım</h2><div id="sportDaily"></div><p class="muted" id="sportWeekSummary"></p></div><div id="sections"></div></div><div id="dashboardView" class="hidden"><div class="card"><h2>🏃 Spor dashboard</h2><div class="stats" id="sportStats"></div></div><div class="card"><h2>📊 Kullanım özeti</h2><p class="muted">Seçilen tarihe kadar olan günler. İşaretlenmeyen günler kullanılmamış sayılır; geçmiş kayıt yoksa da sayıya dahildir.</p><div class="stats" id="stats"></div></div><div class="card"><h2>✨ Son 7 gün</h2><div id="weekStats"></div></div></div><button id="copy">Günlük listemi kopyala</button></main><script>const date=document.getElementById('date'),sections=document.getElementById('sections');const now=new Date();date.value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');function routine(){const day=new Date(date.value+'T12:00:00').getDay();const night=[1,3,5,0].includes(day)?'Retinal':'Salisilik asit';return [['☀️ Sabah',['Nazik temizleyici','Hyaluronic acid','PDRN serum','Peptide cream','SPF 50+','B12','Omega-3']],['🌤️ Akşam',['C vitamini (gerekiyorsa)','Yeterli sıvı aldım']],['🌙 Gece',['Nazik temizleyici',night,'Peptide cream']]]}function update(){const checks=[...sections.querySelectorAll('input[type=checkbox]')],n=checks.filter(x=>x.checked).length;void n}function render(){sections.replaceChildren();for(const [group,items] of routine()){const card=document.createElement('section');card.className='card';const title=document.createElement('h2');title.textContent=group;card.append(title);for(const item of items){const label=document.createElement('label');label.className='item';const check=document.createElement('input');check.type='checkbox';const k='glow:'+date.value+':'+group+':'+item;check.checked=localStorage.getItem(k)==='1';check.onchange=()=>{if(check.checked)localStorage.setItem(k,'1');else localStorage.removeItem(k);update()};const span=document.createElement('span');span.textContent=item;label.append(check,span);card.append(label)}sections.append(card)}update()}function updateDateLabel(){const today=dayKey(new Date());document.getElementById('dateLabel').textContent=date.value===today?'Bugün':new Date(date.value+'T12:00:00').toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});document.getElementById('nextDay').disabled=date.value>=today}function moveDate(n){const d=new Date(date.value+'T12:00:00');d.setDate(d.getDate()+n);const v=dayKey(d);if(v>dayKey(new Date()))return;date.value=v;date.dispatchEvent(new Event('change'))}document.getElementById('prevDay').onclick=()=>moveDate(-1);document.getElementById('nextDay').onclick=()=>moveDate(1);date.max=dayKey(new Date());date.onchange=()=>{updateDateLabel();render()};document.getElementById('copy').onclick=()=>{const lines=[date.value];for(const card of sections.children){lines.push(card.querySelector('h2').textContent);for(const label of card.querySelectorAll('.item'))lines.push((label.querySelector('input').checked?'✓ ':'○ ')+label.querySelector('span').textContent)}const s=lines.join('\n');navigator.clipboard?.writeText(s).then(()=>alert('Kopyalandı')).catch(()=>prompt('Liste:',s))};function statsRender(){const end=new Date(date.value+'T12:00:00'),out=document.getElementById('stats');out.replaceChildren();for(const [label,days] of [['Son 30 gün',30],['Son 3 ay',90],['Son 6 ay',180],['Son 12 ay',365]]){let used=0,missed=0;for(let i=0;i<days;i++){const d=new Date(end);d.setDate(d.getDate()-i);const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const dow=d.getDay(),night=[1,3,5,0].includes(dow)?'Retinal':'Salisilik asit';if(localStorage.getItem('glow:'+ds+':🌙 Gece:'+night)==='1')used++;else missed++}const card=document.createElement('div');card.className='stat';card.innerHTML='<strong>'+label+'</strong><b>'+missed+'</b><small>kullanılmayan gün</small><div class="muted">'+used+' / '+days+' gece tamamlandı</div><div class="bar"><i style="width:'+(used/days*100)+'%"></i></div>';out.append(card)}const w=document.getElementById('weekStats');w.textContent='Günlük kutucukları işaretledikçe istatistiklerin otomatik güncellenir.'}function tab(show){document.getElementById('sportView').classList.add('hidden');document.getElementById('date').style.display='';document.getElementById('routineView').classList.toggle('hidden',!show);document.getElementById('dashboardView').classList.toggle('hidden',show);document.getElementById('routineTab').classList.toggle('active',show);document.getElementById('dashboardTab').classList.toggle('active',!show);document.getElementById('copy').classList.toggle('hidden',!show);if(!show){statsRender();sportStatsRender()}}document.getElementById('routineTab').onclick=()=>tab(true);document.getElementById('dashboardTab').onclick=()=>tab(false);const oldRender=render;render=function(){oldRender();statsRender()};function sportStatsRender(){const end=new Date(date.value+'T12:00:00'),out=document.getElementById('sportStats');out.replaceChildren();for(const [title,days] of [['30 gün',30],['3 ay',90],['6 ay',180],['12 ay',365]]){let done=0;for(let i=0;i<days;i++){const d=new Date(end);d.setDate(d.getDate()-i);if(localStorage.getItem('sport:'+dayKey(d))==='1')done++}const c=document.createElement('div');c.className='stat';c.innerHTML='<strong>'+title+'</strong><b>'+done+'</b><small>spor yapılan gün</small><div class="muted">'+(days-done)+' işaretlenmeyen gün</div>';out.append(c)}}function dayKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function sportRender(){const selected=new Date(date.value+'T12:00:00');const monday=new Date(selected);monday.setDate(selected.getDate()-(selected.getDay()+6)%7);const host=document.getElementById('sportWeek');host.replaceChildren();let count=0;for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);const k='sport:'+dayKey(d),label=document.createElement('label');label.className='item';const cb=document.createElement('input');cb.type='checkbox';cb.checked=localStorage.getItem(k)==='1';if(cb.checked)count++;cb.onchange=()=>{if(cb.checked)localStorage.setItem(k,'1');else localStorage.removeItem(k);sportRender()};const name=document.createElement('span');name.textContent=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'][i]+' • '+d.toLocaleDateString('tr-TR',{day:'numeric',month:'short'});label.append(cb,name);host.append(label)}const summary=document.createElement('p');summary.textContent='Bu hafta: '+count+' / 4 hedef günü'+(count>=4?' 🎉':'');host.prepend(summary);const out=document.getElementById('sportStats');out.replaceChildren();for(const [title,days] of [['Son 30 gün',30],['Son 3 ay',90],['Son 6 ay',180],['Son 12 ay',365]]){let done=0;for(let i=0;i<days;i++){const d=new Date(selected);d.setDate(d.getDate()-i);if(localStorage.getItem('sport:'+dayKey(d))==='1')done++}const el=document.createElement('div');el.className='stat';el.innerHTML='<strong>'+title+'</strong><b>'+done+'</b><small>spor yapılan gün</small><div class="muted">'+(days-done)+' işaretlenmeyen gün</div><div class="bar"><i style="width:'+(done/days*100)+'%"></i></div>';out.append(el)}}const originalDateChange=date.onchange;date.onchange=()=>{originalDateChange();sportDailyRender()};function sportDailyRender(){const el=document.getElementById('sportDaily');el.replaceChildren();const key='sport:'+date.value;const label=document.createElement('label');label.className='item';const cb=document.createElement('input');cb.type='checkbox';cb.checked=localStorage.getItem(key)==='1';cb.onchange=()=>{if(cb.checked)localStorage.setItem(key,'1');else localStorage.removeItem(key);sportDailyRender()};const span=document.createElement('span');span.textContent=cb.checked?'Bugün spor yaptım ✓':'Spor yaptım';label.append(cb,span);el.append(label);const d=new Date(date.value+'T12:00:00'),mon=new Date(d);mon.setDate(d.getDate()-(d.getDay()+6)%7);let n=0;for(let i=0;i<7;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);if(localStorage.getItem('sport:'+dayKey(x))==='1')n++}document.getElementById('sportWeekSummary').textContent='Bu hafta: '+n+' / 4 hedef günü';}const originalRender=render;render=function(){originalRender();sportDailyRender()};updateDateLabel();render();</script></body></html>
