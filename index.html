<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f9e8f4"><title>My Daily Glow</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8fc;color:#37293a;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:550px;margin:auto;padding:25px 18px 60px}h1{margin:0;font-size:29px}p{color:#796b7b}input[type=date]{width:100%;padding:13px;border:1px solid #e8d6e4;border-radius:12px;font-size:17px;background:white}.card{background:white;padding:20px;border:1px solid #f0e0ec;border-radius:20px;margin:18px 0;box-shadow:0 5px 20px #4020400a}h2{font-size:20px;margin:0 0 12px}.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #f5eef4}.item input{width:24px;height:24px;accent-color:#a66a9b}.item:has(input:checked) span{text-decoration:line-through;color:#988c98}.track{height:12px;background:#eee2ed;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:#a66a9b}button{background:#5c3855;color:white;border:0;border-radius:14px;padding:15px;width:100%;font-size:16px}</style></head><body><main><h1>🌸 My Daily Glow</h1><p>Günlük cilt bakımı ve vitamin takibi</p><label>Tarih seç</label><input type="date" id="date"><div class="card"><strong id="progress">0 / 0 tamamlandı</strong><div class="track" style="margin-top:13px"><div class="fill" id="fill"></div></div><p style="font-size:13px">İşaretlerin bu tarayıcıda otomatik saklanır.</p></div><div id="sections"></div><button id="copy">Günlük listemi kopyala</button></main><script>const date=document.getElementById('date'),sections=document.getElementById('sections');const now=new Date();date.value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');function routine(){const day=new Date(date.value+'T12:00:00').getDay();const night=day===1||day===5?'Retinal':day===3?'Salisilik asit':'Hyaluronic acid + PDRN';return [['☀️ Sabah',['Nazik temizleyici','Hyaluronic acid','PDRN serum','Peptide cream','SPF 50+','B12','Omega-3']],['🌤️ Akşam',['C vitamini (gerekiyorsa)','Yeterli sıvı aldım']],['🌙 Gece',['Nazik temizleyici',night,'Peptide cream']]]}function update(){const checks=[...sections.querySelectorAll('input[type=checkbox]')],n=checks.filter(x=>x.checked).length;document.getElementById('progress').textContent=n+' / '+checks.length+' tamamlandı';document.getElementById('fill').style.width=(checks.length?100*n/checks.length:0)+'%'}function render(){sections.replaceChildren();for(const [group,items] of routine()){const card=document.createElement('section');card.className='card';const title=document.createElement('h2');title.textContent=group;card.append(title);for(const item of items){const label=document.createElement('label');label.className='item';const check=document.createElement('input');check.type='checkbox';const k='glow:'+date.value+':'+group+':'+item;check.checked=localStorage.getItem(k)==='1';check.onchange=()=>{if(check.checked)localStorage.setItem(k,'1');else localStorage.removeItem(k);update()};const span=document.createElement('span');span.textContent=item;label.append(check,span);card.append(label)}sections.append(card)}update()}date.onchange=render;document.getElementById('copy').onclick=()=>{const lines=[date.value];for(const card of sections.children){lines.push(card.querySelector('h2').textContent);for(const label of card.querySelectorAll('.item'))lines.push((label.querySelector('input').checked?'✓ ':'○ ')+label.querySelector('span').textContent)}const s=lines.join('\n');navigator.clipboard?.writeText(s).then(()=>alert('Kopyalandı')).catch(()=>prompt('Liste:',s))};render();</script></body></html>
